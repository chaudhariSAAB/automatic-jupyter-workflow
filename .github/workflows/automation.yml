name: Universal Project Automation

run-name: Universal Automation • ${{ inputs.project_type || 'auto' }} • ${{ inputs.prompt }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Project request
        required: true
        type: string
      project_type:
        description: Project type
        required: false
        default: unknown
        type: choice
        options: [unknown, jupyter, data_science, machine_learning, ai, coding, web, app]
      ai_provider:
        description: Optional AI metadata provider
        required: false
        default: none
        type: choice
        options: [none, openai, openrouter, gemini]
      reference:
        description: Optional reference file path already in the repository
        required: false
        default: ''
        type: string
      max_attempts:
        description: Repair attempts (1-5)
        required: false
        default: '2'
        type: string
      package:
        description: Create a ZIP artifact
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: universal-project-automation
  cancel-in-progress: false

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install workflow
        run: python -m pip install -e ".[test]"

      - name: Preflight test suite
        run: python -m pytest -q

      - name: Generate, test, repair, and validate
        env:
          PROMPT: ${{ inputs.prompt }}
          PROJECT_TYPE: ${{ inputs.project_type }}
          AI_PROVIDER: ${{ inputs.ai_provider }}
          REFERENCE: ${{ inputs.reference }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        run: |
          set -euo pipefail
          args=("$PROMPT" --output generated_projects --max-attempts "$MAX_ATTEMPTS" --report generated_projects/report.json --ai-provider "$AI_PROVIDER" --factory)
          if [ "$PROJECT_TYPE" != "unknown" ]; then args+=(--type "$PROJECT_TYPE"); fi
          if [ -n "$REFERENCE" ]; then args+=(--reference "$REFERENCE"); fi
          python -m notebook_workflow.cli "${args[@]}"

      - name: Install generated project dependencies
        if: ${{ hashFiles('generated_projects/requirements.txt') != '' }}
        run: python -m pip install -r generated_projects/requirements.txt

      - name: Run generated project pipeline
        working-directory: generated_projects
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; from src.pipeline import run_analysis; print(run_analysis(Path('.')))"

      - name: Run generated project tests standalone
        working-directory: generated_projects
        run: python -m pytest -q tests

      - name: Execute generated Jupyter notebook(s)
        if: ${{ hashFiles('generated_projects/notebooks/*.ipynb') != '' }}
        working-directory: generated_projects
        run: |
          set -euo pipefail
          mapfile -t notebooks < <(find notebooks -maxdepth 1 -type f -name '*.ipynb' -print | sort)
          if [ "${#notebooks[@]}" -eq 0 ]; then
            echo 'No notebooks found; skipping execution.'
            exit 0
          fi
          for notebook in "${notebooks[@]}"; do
            echo "Executing $notebook"
            jupyter nbconvert --to notebook --execute --inplace "$notebook" --ExecutePreprocessor.timeout=180
          done

      - name: Final security scan and package
        if: ${{ inputs.package }}
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; from notebook_workflow.security import security_scan; ok, errors, warnings = security_scan(Path('generated_projects')); print({'security_ok': ok, 'errors': errors, 'warnings': warnings}); raise SystemExit(0 if ok else 1)"
          python -c "from pathlib import Path; from notebook_workflow.packaging import package_project; print(package_project(Path('generated_projects'), Path('generated_projects.zip')))"

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo '## Universal Project Automation'
            echo ''
            echo "- Project type: ${{ inputs.project_type }}"
            echo "- AI provider: ${{ inputs.ai_provider }}"
            echo "- Repair attempts: ${{ inputs.max_attempts }}"
            echo "- Package requested: ${{ inputs.package }}"
            if [ -f generated_projects/report.json ]; then
              echo '- Report: generated_projects/report.json'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage final artifact only
        if: always()
        run: |
          set -euo pipefail
          rm -rf artifact_output
          mkdir -p artifact_output
          if [ -f generated_projects.zip ]; then cp generated_projects.zip artifact_output/; fi
          if [ -f generated_projects/report.json ]; then cp generated_projects/report.json artifact_output/; fi
          if [ -f generated_projects/workflow_report.json ]; then cp generated_projects/workflow_report.json artifact_output/; fi
          echo 'Final artifact contents:'
          find artifact_output -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload final sanitized artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generated-project
          path: artifact_output/
          if-no-files-found: warn
          retention-days: 14
