name: Final Production Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'notebook_workflow/**'
      - 'tests/**'
      - 'tools/**'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: final-production-verification
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install workflow
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: pytest -q
      - name: Security and workflow contracts
        run: |
          pytest -q tests/test_security_contract.py tests/test_workflow_contract.py tests/test_mobile_control_contract.py

  e2e:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        project_type: [jupyter, data_science, machine_learning, ai, coding, web, app]
    runs-on: ubuntu-latest
    env:
      PROJECT_TYPE: ${{ matrix.project_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Setup Node
        if: matrix.project_type == 'web' || matrix.project_type == 'app'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install workflow
        run: python -m pip install -e ".[test]"
      - name: Generate project
        run: |
          set -euo pipefail
          rm -rf generated_projects
          mkdir -p generated_projects
          python -m notebook_workflow.cli "Build a safe ${PROJECT_TYPE} production starter" \
            --type "$PROJECT_TYPE" \
            --output generated_projects \
            --max-attempts 3 \
            --report generated_projects/report.json \
            --ai-provider none \
            --factory
      - name: Install generated dependencies
        run: |
          set -euo pipefail
          if [ -f generated_projects/requirements.txt ]; then
            python -m pip install -r generated_projects/requirements.txt
          fi
          if [ -f generated_projects/package.json ]; then
            npm install --prefix generated_projects
          fi
      - name: Execute generated tests and pipelines
        run: |
          set -euo pipefail
          if [ -f generated_projects/pytest.ini ] || find generated_projects -maxdepth 2 -type f -name 'test_*.py' -print -quit | grep -q .; then
            (cd generated_projects && python -m pytest -q tests)
          fi
          if [ -f generated_projects/Makefile ]; then
            make -C generated_projects test
          fi
      - name: Execute notebooks
        if: matrix.project_type == 'jupyter' || matrix.project_type == 'data_science' || matrix.project_type == 'machine_learning' || matrix.project_type == 'ai'
        run: |
          set -euo pipefail
          if find generated_projects -type f -name '*.ipynb' -print -quit | grep -q .; then
            python -m jupyter nbconvert --to notebook --execute --inplace $(find generated_projects -type f -name '*.ipynb')
          fi
      - name: Security scan
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; from notebook_workflow.security import security_scan; ok, errors, warnings = security_scan(Path('generated_projects')); print({'security_ok': ok, 'errors': errors, 'warnings': warnings}); raise SystemExit(0 if ok else 1)"
      - name: Generate SBOM
        run: |
          set -euo pipefail
          python -m notebook_workflow.sbom generated_projects --output generated_projects/sbom.spdx.json
          test -f generated_projects/sbom.spdx.json
      - name: Package project and checksum
        run: |
          set -euo pipefail
          zip_name="${PROJECT_TYPE}-generated-project.zip"
          (cd generated_projects && zip -qr "../${zip_name}" .)
          sha256sum "${zip_name}" > "${zip_name}.sha256"
          sha256sum -c "${zip_name}.sha256"
      - name: Upload generated project artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: final-${{ matrix.project_type }}-project
          path: |
            ${{ env.PROJECT_TYPE }}-generated-project.zip
            ${{ env.PROJECT_TYPE }}-generated-project.zip.sha256
          if-no-files-found: error
          retention-days: 14
