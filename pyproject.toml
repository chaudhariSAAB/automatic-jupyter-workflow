[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automatic-jupyter-workflow"
version = "0.2.0"
description = "Universal project automation for Jupyter, data science, AI, ML, coding, web, and app workflows."
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
